<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/heart-cursor.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RSVP | MacInnis + Allory</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="scroll-page">

<main class="text-page rsvp-page">

    <a href="index.html" class="return-home">
        RETURN HOME
    </a>


    <h1>
        RSVP
    </h1>


    <h2>
        WILL YOU JOIN US?
    </h2>


    <form class="rsvp-form" id="rsvp-form" autocomplete="off">

        <div class="radio-group">

            <label>
                <input
                    type="radio"
                    name="attendance"
                    value="yes"
                    required
                >
                YES, HAPPILY!
            </label>

            <label>
                <input
                    type="radio"
                    name="attendance"
                    value="no"
                >
                NO, REGRETFULLY.
            </label>

        </div>


        <label>
            NAME
        </label>


        <div id="guest-list">

            <div class="guest-entry">

                <input
                    type="text"
                    name="guest"
                    autocomplete="off"
                    required
                >

            </div>

        </div>


        <button
            type="button"
            id="add-guest"
        >
            ADD ANOTHER GUEST
        </button>


        <button
            type="submit"
            id="submit-button"
        >
            SUBMIT
        </button>

    </form>

</main>


<script src="rsvp.js"></script>

</body>

</html>
